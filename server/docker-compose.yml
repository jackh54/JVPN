# JVPN server — host networking + TUN (Linux VPS).
# Copy deploy/.env.example → .env next to this file (or use deploy/).
#
# Local (Linux with TUN):
#   cd server && cp deploy/.env.example .env   # edit secrets
#   sudo docker compose up -d --build
#
# Admin: http://127.0.0.1:18080  (SSH tunnel from laptop if remote)

services:
  jvpn-server:
    image: ${JVPN_IMAGE:-ghcr.io/jackh54/jvpn-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jvpn-server
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ${JVPN_DATA_DIR:-/etc/jvpn}:/etc/jvpn:ro
      - ${JVPN_CERTS_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
    environment:
      JVPN_TLS_SAN: ${JVPN_TLS_SAN:-}
    command:
      - -listen
      - ${JVPN_LISTEN:-:443}
      - -transport
      - ${JVPN_TRANSPORT:-ws}
      - -ws-path
      - ${JVPN_WS_PATH:-/ws}
      - -cert
      - ${JVPN_CERT:-/etc/letsencrypt/live/vpn.blakout.dev/fullchain.pem}
      - -key
      - ${JVPN_KEY:-/etc/letsencrypt/live/vpn.blakout.dev/privkey.pem}
      - -token-file
      - ${JVPN_TOKEN_FILE:-/etc/jvpn/token}
      - -tun-name
      - ${JVPN_TUN_NAME:-jvpn0}
      - -setup-tun
      - -setup-nat
      - -admin-listen
      - ${JVPN_ADMIN_LISTEN:-127.0.0.1:18080}
      - -admin-user
      - ${JVPN_ADMIN_USER:-admin}
      - -admin-pass
      - ${JVPN_ADMIN_PASS:?set JVPN_ADMIN_PASS in .env}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:18080/healthz | grep -q '\"ok\":true' || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

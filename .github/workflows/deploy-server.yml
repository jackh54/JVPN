name: Deploy JVPN server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jackh54/jvpn-server

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::12}"
          echo "tag=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:sha-${SHA_SHORT},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN,COMPOSE_DIR
          script: |
            set -euo pipefail
            DIR="${COMPOSE_DIR:-/opt/jvpn}"
            cd "$DIR"
            export JVPN_IMAGE="ghcr.io/jackh54/jvpn-server:${IMAGE_TAG}"
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi
            docker compose pull
            docker compose up -d --remove-orphans
            echo "Waiting for healthy…"
            for i in $(seq 1 36); do
              if curl -fsS http://127.0.0.1:18080/healthz | grep -q '"ok":true'; then
                echo "healthz ok"
                curl -fsS http://127.0.0.1:18080/healthz
                exit 0
              fi
              sleep 5
            done
            echo "deploy health check failed"
            docker compose ps || true
            docker compose logs --tail=100 || true
            exit 1
        env:
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          COMPOSE_DIR: ${{ secrets.VPS_COMPOSE_DIR }}
